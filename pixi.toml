# Single source of truth for the runtime — used by local dev, Docker, and CI.
# Add every dependency a notebook imports here. Local "kitchen-sink" envs
# (e.g. pangeo) hide missing deps; CI builds strictly from this file and will
# silently produce empty notebook cells if anything is missing.
#
# pixi.lock (committed alongside this file) pins every package to an exact
# build hash per platform. Regenerate it with `pixi install` after editing
# this file; commit both files in the same commit.

[workspace]
name = "sado-estuary-replication-2026"
# bioconda hosts snakemake (and downstream rule-engine ecosystem); conda-forge
# is the priority channel for everything else.
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
# --- core scientific stack ---
numpy = "*"
pandas = ">=2.0"
xarray = ">=2024.6"
scipy = "*"
matplotlib = "*"
pyarrow = "*"
# --- notebook execution + Jupyter Book ---
jupytext = "*"
jupyterlab = "*"
nbclient = "*"
ipykernel = "*"
# --- pipeline driver ---
snakemake = "*"
# --- data access ---
requests = "*"              # Rijkswaterstaat DDAPI 2.0 + Copernicus Data Space OData
boto3 = "*"                 # Copernicus S3 (eodata) granule download — scripts/fetch_granules.py
# --- geospatial / EO ---
netcdf4 = "*"               # NetCDF I/O — preferred over .npz for arrays (see DOMAIN.md)
rasterio = "*"              # Sentinel-2 granule raster I/O
libgdal-jp2openjpeg = "*"   # JP2 driver — WITHOUT this rasterio cannot open S2 .jp2 bands
# --- Acolite runtime (its own environment.yml, github.com/acolite/acolite) ---
# Acolite is an external program we call, not a library, but it runs on THIS pixi
# env via the container shim, so its deps must be here. Verified against the probe:
# missing osgeo -> "No module named 'osgeo'"; missing skimage -> L2W never runs,
# only L1R (TOA) is produced. Added the full declared set to stop dep-by-dep churn.
gdal = "*"                  # osgeo python bindings — Acolite imports osgeo.gdal directly
libgdal-netcdf = "*"        # gdal NetCDF driver (Acolite writes via gdal)
scikit-image = "*"          # Acolite L2 processing — without it, no L2W / rhow_*
pyresample = "*"            # Acolite reprojection/resampling
pyhdf = "*"                 # Acolite HDF ancillary readers
h5py = "*"                  # Acolite HDF5 I/O
pygrib = "*"                # Acolite GRIB ancillary (ERA5 etc.)
cartopy = "*"               # Acolite mapping utilities
fsspec = "*"                # Acolite remote/cloud file access
aiohttp = "*"               # Acolite async ancillary download
geopandas = "*"             # station geometry, estuary masks
pyproj = "*"                # CRS transforms (WGS84 <-> UTM31N for Westerschelde)
dask = "*"                  # out-of-core scene processing
shapely = "*"               # scene-footprint containment tests in 02
# --- HEALPix / DGGS archival of derived products (notebook 05) ---
# healpix-geo, not healpy: geographic data needs WGS84 ellipsoidal corrections.
# Always NESTED, and always ellipsoid="WGS84" — see DOMAIN.md.
healpix-geo = "*"           # conda-forge
zarr = ">=3"                # EOPF Zarr / GRID4EARTH profile requires Zarr v3
xdggs = "*"                 # DGGS-aware xarray accessors for reading the archive

# Atmospheric-correction processors are NOT conda/pip packages — they are external
# programs installed by the Dockerfile:
#   Acolite  (GPL-3.0)  cloned from github.com/acolite/acolite
#   C2RCC    (GPL-3.0)  ships inside ESA SNAP, invoked via `gpt`
#   Polymer             opt-in [feature.polymer] only — never in the public image
# See docs/polymer-licence-and-version.md and notebooks/03_analysis.py.
# --- replace/extend with the deps your replication needs ---
# Examples (uncomment as needed):
# statsmodels = "*"          # GLM/GLMM regression
# scikit-learn = "*"         # classical ML
# pyproj = "*"               # CRS + map projections
# cartopy = "*"              # geographic plotting
# netcdf4 = "*"              # NetCDF I/O — preferred over .npz for arrays (see DOMAIN.md)
# zarr = "*"                 # Zarr — preferred for arrays >2 GB or cloud-archived (see DOMAIN.md)
# cdsapi = "*"               # Copernicus Climate Data Store
# copernicusmarine = "*"     # Copernicus Marine Service
# healpix-geo = "*"          # HEALPix on geo data — preferred (use nest=True — see DOMAIN.md)
# healpy = "*"               # HEALPix on pure-sphere (astrophysics) only
# rasterio = "*"             # raster I/O
# geopandas = "*"            # vector I/O
# dask = "*"                 # out-of-core / parallel

# Pip-only deps go in [pypi-dependencies]. Conda-forge is preferred where available.
[pypi-dependencies]
# healpix-resample is PyPI-only (GRID4EARTH); not published on conda-forge.
# (lon,lat)->HEALPix regridding of the derived products in notebook 05.
healpix-resample = "*"
# pygbif = "*"               # GBIF occurrences
# polytope-client = "*"      # Destination Earth Climate DT
# earthkit-data = "*"

[feature.docs.dependencies]
mystmd = "*"

[feature.tests.dependencies]
pytest = "*"
# ruamel.yaml round-trips YAML *with* its comments. scripts/set_release_identifiers.py
# rewrites CITATION.cff in place, and pyyaml would silently delete every
# explanatory comment in it.
"ruamel.yaml" = "*"
# rdflib parses the nanopub TEMPLATE TriG that IS the schema for each FORRT chain
# step. scripts/template_fields.py extracts the field spec from it; the offline
# tests and scripts/check_template_drift.py both need it. See nanopubs/templates/.
rdflib = "*"

# Polymer is NOT open source. Hygeos Terms of Use v2.0 §2/§10 forbid transferring it to
# third parties, so it must never be baked into the published Docker image or the Zenodo
# tarball. Keeping it in an opt-in feature means each user installs it directly from Hygeos
# under their own acceptance of the Terms — which is also what §3 requires, since the licence
# is granted per-user for the user's own country. See docs/polymer-licence-and-version.md.
#
# v4.17.3, not the paper's v4.12: v4.15 added support for Sentinel-2 processing baseline
# 04.00, whose TOA reflectance offset applies to the reprocessed 2018-2020 archive we use.
[feature.polymer.pypi-dependencies]
polymer = { git = "https://github.com/hygeos/polymer.git", tag = "v4.17.3" }

[environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }
# Opt-in: `pixi run -e polymer ...` enables the third atmospheric-correction chain.
polymer = { features = ["polymer"], solve-group = "default" }

[tasks]
run = "snakemake --cores 1"
book = "myst build --html"
lab = "jupyter lab"

# The `tests` feature and environment already existed here; nothing declared a
# task and no workflow ever invoked pytest, so it was scaffolding that had never
# run. Wired into ci.yml.
#   pixi run -e tests test
[feature.tests.tasks]
test = "pytest tests/ -q"
# Compares the live FORRT templates against nanopubs/templates/fields.snapshot.json.
# Networked, so NOT in the per-PR gate — run on demand or on schedule
# (.github/workflows/template-drift.yml). `--update` re-vendors the snapshot.
check-templates = "python scripts/check_template_drift.py"
# Builds nanopubs/chain-draft.json (the pre-filled hand-off for the Science Live
# FORRT-chain wizard) from CITATION.cff + the drafts + PUBLISHED.md. Offline, no
# Claude. See docs/chain-draft-contract.md. Run after drafting, then commit the file.
build-chain-draft = "python scripts/build_chain_draft.py"
sync-drafts = "python scripts/sync_draft_skeletons.py"
